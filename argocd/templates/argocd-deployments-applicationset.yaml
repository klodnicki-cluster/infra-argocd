apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-deployments
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - scmProvider:
        github:
          organization: klodnicki-cluster
        filters:
          - labelMatch: argocd

  template:
    metadata:
      name: {{ "{{.repository.name}}" | quote }}
      namespace: argocd
      labels:
        managed-by: argocd-applicationset
        source-repo: {{ "{{.repository.name}}" | quote }}
      annotations:
        description: {{ "Discovered from {{.repository.url}}" | quote }}
    
    spec:
      project: default
      
      # Source: the discovered repository
      source:
        repoURL: {{ "{{.repository.url}}" | quote }}
        targetRevision: HEAD
        # Each repo must have an argocd/ directory with Chart.yaml and values.yaml
        path: argocd/
        
        # Helm configuration: deploy whatever chart is in argocd/
        helm:
          releaseName: {{ "{{.repository.name}}" | quote }}
          # Use the values.yaml in the argocd/ directory
          valueFiles:
            - values.yaml
      
      # Destination: deploy to cluster-local namespace matching repo name
      destination:
        server: https://kubernetes.default.svc
        # Namespace defaults to repository name (sanitized for Kubernetes)
        # Repos can override via custom Application in argocd/templates/
        namespace: {{ "{{.repository.name}}" | quote }}
      
      # Sync policy: enable auto-sync with self-healing
      syncPolicy:
        automated:
          prune: true    # Delete resources no longer in the repo
          selfHeal: true # Reconcile if cluster drifts from git
        
        syncOptions:
          - CreateNamespace=true
        
        # Retry on transient failures
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
