apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Source: this repository
  source:
    repoURL: https://github.com/klodnicki-cluster/infra-argocd.git
    targetRevision: HEAD
    path: argocd/
    
    # Helm configuration
    helm:
      releaseName: argocd
      # Use the wrapper chart with values.yaml for the argo-cd dependency
      valueFiles:
        - values.yaml
  
  # Destination: deploy to local cluster in argocd namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  # Sync policy: enable auto-sync with auto-prune and self-heal
  syncPolicy:
    automated:
      prune: true    # Delete resources that are no longer in the repo
      selfHeal: true # Auto-sync when cluster state drifts
    
    # Retry configuration for transient failures
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
