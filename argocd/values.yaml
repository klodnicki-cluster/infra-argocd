argo-cd:
  global:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ''
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
  server:
    ingress:
      enabled: true
      hostname: argocd.cluster.zack.klodnicki.com
      annotations:
        traefik.ingress.kubernetes.io/service.scheme: "https"
        traefik.ingress.kubernetes.io/servers-insecure: "true"
